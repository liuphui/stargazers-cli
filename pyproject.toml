[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "stargazers-cli"
version = "0.1.0"
description = "A lightweight CLI tool that finds the most starred repositories in a given language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
stargazers = "stargazers.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stargazers"]